name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bmake
      - name: Build and test with sanitizers
        env:
          LC_ALL: C.UTF-8
        run: |
          make -f GNUmakefile clean
          make -f GNUmakefile all test \
            NLS_LOCALE=ru_RU.UTF-8 UTF8_LOCALE=C.UTF-8 \
            CFLAGS="-O1 -g -std=gnu99 -Wall -Wextra -Wconversion -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined"
          bmake -f Makefile clean
          bmake -f Makefile all test \
            NLS_LOCALE=ru_RU.UTF-8 UTF8_LOCALE=C.UTF-8 \
            CFLAGS="-O1 -g -std=gnu99 -Wall -Wextra -Wconversion -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined"
